name: ci

on:
  push:
    branches:
      - main
      - "claude/**"
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: analyze & test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dart-lang/setup-dart@v1
        with:
          sdk: stable

      - name: Dart version
        run: dart --version

      - name: Resolve dependencies
        run: dart pub get

      - name: Analyze
        run: dart analyze --fatal-infos

      - name: Test
        run: dart test --reporter expanded

      - name: Compile binary
        run: dart compile exe bin/istream.dart -o istream

      - name: Smoke test compiled binary
        run: ./istream design examples/sample.yaml --format=json | head -20
